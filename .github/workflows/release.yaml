name: release

# Publishing is reachable only from an immutable tag push. The token with
# packages: write never exists in the PR-triggered ci.yaml workflow.
"on":
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: lint
        uses: golangci/golangci-lint-action@v9

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: setup-helm
        uses: azure/setup-helm@v5
      - name: set-up-buildx
        uses: docker/setup-buildx-action@v4
      - name: image-repository
        id: image-repository
        shell: bash
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image_repository=ghcr.io/${owner}/talos-kms" >> "${GITHUB_OUTPUT}"
      - name: goreleaser-check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
        env:
          IMAGE_REPOSITORY: ${{ steps.image-repository.outputs.image_repository }}
      - name: login-to-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: goreleaser-release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ steps.image-repository.outputs.image_repository }}
