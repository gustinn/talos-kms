name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

"on":
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: lint
        uses: golangci/golangci-lint-action@v9

  chart:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup-helm
        uses: azure/setup-helm@v5
      - name: lint
        run: |
          set -euo pipefail
          helm lint deploy/helm/talos-kms
          helm lint deploy/helm/talos-kms -f deploy/helm/ci-values.yaml
      - name: render
        run: |
          set -euo pipefail
          # Default values, every optional resource enabled, and the degenerate
          # paths (inline test keys, probes/metrics/TLS disabled).
          helm template talos-kms deploy/helm/talos-kms > rendered-default.yaml
          helm template talos-kms deploy/helm/talos-kms -f deploy/helm/ci-values.yaml > rendered-full.yaml
          helm template talos-kms deploy/helm/talos-kms \
            -f deploy/helm/ci-values.yaml \
            --set externalSecret.enabled=false \
            --set masterKey.keys.v1=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE= \
            --set probes.enabled=false \
            --set metrics.enabled=false \
            --set tls.enabled=false \
            > rendered-edge.yaml
      - name: kubeconform
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          # Strict schema validation of built-in kinds, pinned to a released
          # k8s schema version for reproducibility. CRDs (ExternalSecret,
          # Certificate, ServiceMonitor) have no schema here and are skipped.
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.34.0 \
            rendered-default.yaml rendered-full.yaml rendered-edge.yaml

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: setup-helm
        uses: azure/setup-helm@v5
      - name: set-up-buildx
        uses: docker/setup-buildx-action@v4
      - name: image-repository
        id: image-repository
        shell: bash
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image_repository=ghcr.io/${owner}/talos-kms" >> "${GITHUB_OUTPUT}"
      - name: goreleaser-check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
        env:
          IMAGE_REPOSITORY: ${{ steps.image-repository.outputs.image_repository }}
      - name: login-to-ghcr
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: goreleaser-snapshot
        if: github.ref_type != 'tag'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ steps.image-repository.outputs.image_repository }}
      - name: upload-snapshot-artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: talos-kms-snapshot
          path: dist/*
          if-no-files-found: error
      - name: goreleaser-release
        if: github.ref_type == 'tag'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ steps.image-repository.outputs.image_repository }}
