{{- if and (not .Values.externalSecret.enabled) .Values.masterKey.keys }}
# Inline keys for testing only. In production, leave masterKey.keys empty and
# source the Secret via externalSecret (keep key material out of values/Git).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.masterKey.secretName }}
  labels:
    {{- include "talos-kms.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $id, $b64 := .Values.masterKey.keys }}
  {{ $id }}: {{ $b64 }}
  {{- end }}
{{- end }}
