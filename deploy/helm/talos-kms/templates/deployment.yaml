apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "talos-kms.fullname" . }}
  labels:
    {{- include "talos-kms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "talos-kms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "talos-kms.selectorLabels" . | nindent 8 }}
    spec:
      {{- with (include "talos-kms.priorityClassName" .) }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "talos-kms.selectorLabels" . | nindent 20 }}
      {{- end }}
      containers:
        - name: kms-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --kms-api-endpoint={{ .Values.apiEndpoint }}
            - --key-dir=/etc/kms/keys
            - --current-key-id={{ .Values.masterKey.currentKeyId }}
            {{- if .Values.probes.enabled }}
            - --probe-endpoint=:{{ .Values.probes.port }}
            {{- else }}
            - --probe-endpoint=
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-endpoint=:{{ .Values.metrics.port }}
            {{- else }}
            - --metrics-endpoint=
            {{- end }}
            - --bind-client-ip={{ .Values.bindClientIP }}
            {{- if .Values.tls.enabled }}
            - --tls-enable
            - --tls-cert-path=/etc/kms/tls/tls.crt
            - --tls-key-path=/etc/kms/tls/tls.key
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.probes.enabled }}
            - name: probes
              containerPort: {{ .Values.probes.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.probes.enabled }}
          # Uses the plaintext probe endpoint because the KMS gRPC API may require TLS.
          livenessProbe:
            httpGet:
              path: /livez
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: keys
              mountPath: /etc/kms/keys
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/kms/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: keys
          secret:
            secretName: {{ .Values.masterKey.secretName }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
