{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.masterKey.secretName }}
  labels:
    {{- include "talos-kms.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.masterKey.secretName }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.keys }}
    - secretKey: {{ required "each externalSecret.keys[].secretKey is required" .secretKey }}
      remoteRef:
        key: {{ required "each externalSecret.keys[].remoteRef.key is required" .remoteRef.key }}
        {{- with .remoteRef.property }}
        property: {{ . }}
        {{- end }}
        {{- with $.Values.externalSecret.decodingStrategy }}
        decodingStrategy: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
